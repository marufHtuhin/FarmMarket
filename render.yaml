# FarmMarket on Render (Blueprint).
#
# Render has NO managed MySQL — attach an external MySQL 8 database (e.g. a
# Railway MySQL service) and paste its URL as DATABASE_URL when the Blueprint
# prompts for it. See PAAS_DEPLOY.md for the full steps.
#
# Notes:
# - plan: starter keeps the service always-on and allows the persistent disk
#   (free services spin down after 15 min of inactivity and cannot have a
#   disk, so uploaded photos would be lost on every redeploy).
# - The disk holds uploaded listing photos at /app/uploads (1 GB).
# - SECRET_KEY is generated by Render on first apply (generateValue).
# - GEMINI_API_KEY is optional; leave it blank in the prompt if you do
#   not have a key yet (labelled fallbacks apply). Weather needs no key:
#   Open-Meteo is keyless, and OPENWEATHER_API_KEY is legacy/ignored.
services:
  - type: web
    name: farmmarket
    runtime: docker
    plan: starter
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TIMEOUT_S
        value: "20"
      # Email (password reset + registration verification). Optional: without
      # a mailer the app still runs, but no emails are sent — and in
      # production the reset/verification tokens are never in API
      # responses, so set one up before real users depend on
      # reset/verification. Render's FREE plan blocks outbound SMTP ports
      # (25/465/587), so Gmail SMTP CANNOT send mail from a free service:
      # use an HTTPS email API instead. Precedence is Brevo, then
      # Mailjet, then Postmark, then SendGrid, then SMTP (first
      # configured wins). Brevo is primary (free 300/day, Gmail signup
      # OK, single-sender verification); Mailjet blocked one account
      # (mj-0001 "temporarily blocked"); Postmark needs a work email at
      # signup; SendGrid blocked one account at login. The sender
      # address (SMTP_FROM or SMTP_USER) must be verified with the
      # provider in use (Brevo verified sender / Mailjet sender address
      # / Postmark Sender Signature / SendGrid Single Sender). The SMTP
      # vars are for local dev (and paid Render plans) only. Gmail app
      # password: Google Account -> Security -> 2-Step Verification ON ->
      # App passwords — see backend/.env.example for the full steps.
      - key: BREVO_API_KEY
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_API_SECRET
        sync: false
      - key: POSTMARK_SERVER_TOKEN
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      # In-app scheduler (daily price-freshness check). Runs in-process, so
      # keep numInstances at 1. FAOSTAT is annual-only and is never scheduled.
      - key: SCHEDULER_ENABLED
        value: "true"
    disk:
      name: farmmarket-uploads
      mountPath: /app/uploads
      sizeGB: 1
