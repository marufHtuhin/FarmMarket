# FarmMarket on Render (Blueprint).
#
# Render has NO managed MySQL — attach an external MySQL 8 database (e.g. a
# Railway MySQL service) and paste its URL as DATABASE_URL when the Blueprint
# prompts for it. See PAAS_DEPLOY.md for the full steps.
#
# Notes:
# - plan: starter keeps the service always-on and allows the persistent disk
#   (free services spin down after 15 min of inactivity and cannot have a
#   disk, so uploaded photos would be lost on every redeploy).
# - The disk holds uploaded listing photos at /app/uploads (1 GB).
# - SECRET_KEY is generated by Render on first apply (generateValue).
# - GEMINI_API_KEY is optional; leave it blank in the prompt if you do
#   not have a key yet (labelled fallbacks apply). Weather needs no key:
#   Open-Meteo is keyless, and OPENWEATHER_API_KEY is legacy/ignored.
services:
  - type: web
    name: farmmarket
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TIMEOUT_S
        value: "20"
      # Email (password reset + registration verification). Optional: without
      # SMTP the app still runs, but no emails are sent — and in production
      # the reset/verification tokens are never in API responses, so set
      # these before real users depend on reset/verification. Gmail:
      # host smtp.gmail.com, port 587, TLS on, user = your Gmail address,
      # password = a Gmail app password (NOT the real Gmail password) —
      # see backend/.env.example for the app-password steps.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      # In-app scheduler (daily price-freshness check). Runs in-process, so
      # keep numInstances at 1. FAOSTAT is annual-only and is never scheduled.
      - key: SCHEDULER_ENABLED
        value: "true"
